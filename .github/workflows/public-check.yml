name: Public registry checks
on: [push, pull_request]
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_strategy_experiment_registry.py --metadata-only
      - run: python tools/check_strategy_candidates.py
      - run: python -m pytest src/panteon_v2/tests/test_experiment_registry.py -q
