services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.7
    restart: "no"
    environment:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    volumes:
      - ./user_data:/freqtrade/user_data
      - ../vendor/freqtrade/freqtrade/templates:/freqtrade/upstream_templates:ro
    command: >
      trade
      --config /freqtrade/user_data/config.dryrun.json
      --userdir /freqtrade/user_data
      --strategy ExiaMarketModeStrategyV2
      --strategy-path /freqtrade/user_data/strategies
      --db-url sqlite:////freqtrade/user_data/exia.dryrun.sqlite
      --logfile /freqtrade/user_data/logs/exia.log
